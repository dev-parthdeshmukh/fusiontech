[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fusionmap"
version = "1.0.0"
description = "AI software pipeline that fuses separately acquired PET and MRI scans into a single colour-coded DICOM — PET-MRI precision without PET-MRI hardware."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Team Code Blooded" }]
keywords = ["pet", "mri", "image-fusion", "registration", "voxelmorph", "dicom", "medical-imaging"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "SimpleITK>=2.3",
  "pydicom>=2.4",
  "pynetdicom>=2.0",
  "scikit-image>=0.21",
  "onnxruntime>=1.16",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
train = ["torch>=2.2", "onnx>=1.15", "onnxscript>=0.1"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
fusionmap = "fusionmap.cli:main"

[tool.setuptools.packages.find]
include = ["fusionmap*"]

[tool.setuptools.package-data]
fusionmap = ["data/templates/*", "models/*.onnx", "models/*.json", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["slow: full-resolution end-to-end tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B905"]
